<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Answer Builder</title>
<style>
:root{--ink:#1d2b3a;--mute:#5b6b7b;--bg:#f4f7fa;--card:#fff;--line:#d5dde6;--c0:#2f6fd0;--c1:#1f8553;--c2:#b0680a;--c3:#7a4fc2}
@media(prefers-color-scheme:dark){:root{--ink:#e8eef4;--mute:#9db0c2;--bg:#101820;--card:#18232e;--line:#2c3b4a;--c0:#6ea2f5;--c1:#5cc48c;--c2:#e8a247;--c3:#aa8cf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 70px}
h1{font-size:1.7rem;margin:.1em 0 .2em}
h2{font-size:1.1rem;margin:1.6em 0 .4em}
p.sub{color:var(--mute);margin:0 0 1em}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>label{flex:1;min-width:200px;font-size:.9rem;color:var(--mute)}
select,textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:4px}
textarea{min-height:76px;resize:vertical}
select:focus,textarea:focus,input:focus,button:focus-visible{outline:3px solid var(--c0);outline-offset:1px}
.slot{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--col);border-radius:8px;padding:12px 14px;margin:14px 0}
.slot h3{margin:0;font-size:1.05rem;color:var(--col)}
.hint{margin:.2em 0 .3em;color:var(--mute);font-size:.93rem}
.why{margin-top:10px;padding-top:8px;border-top:2px dashed var(--col)}
.why b{color:var(--col)}
.cnt{font-size:.8rem;color:var(--mute);text-align:right}
.cnt.ok{color:var(--c1);font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--c1);transition:width .25s}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 18px;background:var(--c0);color:#fff;cursor:pointer;margin:4px 6px 4px 0}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#msg{color:var(--c2);font-weight:700;margin:8px 0}
#out{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:1.05rem;line-height:1.8}
#out span{border-bottom:3px solid var(--col)}
.legend span{display:inline-block;margin-right:12px;font-size:.85rem;border-bottom:3px solid var(--col)}
.chk label{display:block;margin:6px 0;cursor:pointer}
.chk input{width:20px;height:20px;vertical-align:-4px;margin-right:8px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>Answer Builder</h1>
<p class="sub">Turn what you know into a complete, organised answer. Fill every box, then build.</p>

<div class="row">
  <label>Subject framework<select id="fw"></select></label>
  <label>Help level<select id="lvl">
    <option value="full">Full help (questions + starters)</option>
    <option value="starters">Starters only</option>
    <option value="labels">Box names only</option>
  </select></label>
</div>

<h2>1. The question</h2>
<input type="text" id="q" placeholder="Paste or type the exam or homework question">

<h2>2. Brain-dump</h2>
<p class="hint">Say it out loud first, then type everything you know. Messy is fine. No order needed.</p>
<textarea id="dump" style="min-height:110px"></textarea>

<h2>3. Fill the boxes</h2>
<div class="bar"><i id="prog"></i></div>
<div id="slots"></div>

<button id="build">Build my answer</button>
<button class="alt" id="reset">Start over</button>
<div id="msg" role="status"></div>

<div id="result" hidden>
  <h2>4. Your answer</h2>
  <div class="legend" id="legend"></div>
  <div id="out"></div>
  <button id="copy" class="alt">Copy answer</button>
  <h2>5. Check it before you finish</h2>
  <div class="chk" id="chk"></div>
</div>
</main>

<script>
const WHY=[
  {t:"Why is that true? Explain it.",s:"This shows that … because …"},
  {t:"Why does that matter for the question?",s:"This matters because …"}
];
const FW={
 peel:{name:"PEEL: English and humanities",slots:[
  {l:"Point",p:"Answer the question in one clear sentence.",s:"The main reason is that …",m:6},
  {l:"Evidence",p:"Give one fact, quote or example from your notes.",s:"For example, … / According to …",m:8},
  {l:"Explain",p:"Explain how your evidence proves your point.",s:"This shows that …",m:8,why:1},
  {l:"Link",p:"Connect back to the question.",s:"Therefore … / This is important because …",m:6}]},
 cer:{name:"CER: Science",slots:[
  {l:"Claim",p:"Answer the question in one sentence.",s:"I claim that …",m:6},
  {l:"Evidence",p:"What data or observation supports your claim?",s:"The data shows that …",m:8},
  {l:"Reasoning",p:"Which rule or idea connects the evidence to the claim?",s:"This is because …",m:8,why:1}]},
 dee:{name:"Define, Explain, Example: Computer science (custom)",slots:[
  {l:"Define",p:"What is it? Give a plain definition.",s:"X is a … that …",m:6},
  {l:"Explain",p:"How does it work, or why is it used?",s:"It works by …",m:8,why:1},
  {l:"Example",p:"Give a real example.",s:"For example, in … ",m:8},
  {l:"Link",p:"When is it useful? Connect to the question.",s:"This is useful when …",m:6}]}
};
const COL=["--c0","--c1","--c2","--c3"];
const $=s=>document.querySelector(s);
const wc=t=>(t||"").trim().split(/\s+/).filter(Boolean).length;
let S=(()=>{try{return JSON.parse(localStorage.getItem("ab1"))}catch(e){return null}})()||{fw:"peel",lvl:"full",q:"",dump:"",a:{},chk:{}};
const save=()=>{try{localStorage.setItem("ab1",JSON.stringify(S))}catch(e){}};

function fields(){
  const out=[];
  FW[S.fw].slots.forEach((sl,i)=>{
    out.push({k:S.fw+"."+i+".0",slot:i,l:sl.l,p:sl.p,s:sl.s,m:sl.m,main:1});
    if(sl.why)WHY.forEach((w,n)=>out.push({k:S.fw+"."+i+"."+(n+1),slot:i,l:"Why? Step "+(n+1),p:w.t,s:w.s,m:5}));
  });
  return out;
}

function render(){
  $("#fw").innerHTML=Object.keys(FW).map(k=>`<option value="${k}">${FW[k].name}</option>`).join("");
  $("#fw").value=S.fw;$("#lvl").value=S.lvl;$("#q").value=S.q;$("#dump").value=S.dump;
  let h="",cur=-1;
  fields().forEach(f=>{
    if(f.slot!==cur){ if(cur>=0)h+="</div>"; cur=f.slot; h+=`<div class="slot" style="--col:var(${COL[f.slot%4]})">`; }
    const hint=S.lvl==="full"?`<p class="hint">${f.p}</p>`:"";
    const ph=S.lvl==="labels"?"":f.s;
    const title=f.main?`<h3>${f.l}</h3>`:`<div class="why"><b>${f.l}</b>`;
    h+=`${title}${hint}<textarea data-k="${f.k}" placeholder="${ph}" aria-label="${f.l}">${S.a[f.k]||""}</textarea><div class="cnt" data-c="${f.k}"></div>${f.main?"":"</div>"}`;
  });
  $("#slots").innerHTML=h+"</div>";
  $("#chk").innerHTML=["My first sentence answers the question directly.","Every fact has a because that explains it.","I linked back to the question at the end.","I read my answer out loud once."]
    .map((t,i)=>`<label><input type="checkbox" data-i="${i}" ${S.chk[i]?"checked":""}>${t}</label>`).join("");
  $("#result").hidden=true;$("#msg").textContent="";
  update();
}

function update(){
  const fs=fields();let done=0;
  fs.forEach(f=>{
    const n=wc(S.a[f.k]),ok=n>=f.m;if(ok)done++;
    const c=document.querySelector(`[data-c="${f.k}"]`);
    if(c){c.textContent=ok?`${n} words. Done`:`${n} of ${f.m} words`;c.className="cnt"+(ok?" ok":"");}
  });
  $("#prog").style.width=(100*done/fs.length)+"%";
  return fs.filter(f=>wc(S.a[f.k])<f.m);
}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){S.a[t.dataset.k]=t.value;update();}
  else if(t.id==="q")S.q=t.value;
  else if(t.id==="dump")S.dump=t.value;
  else if(t.dataset.i!==undefined)S.chk[t.dataset.i]=t.checked;
  save();
});
$("#fw").onchange=e=>{S.fw=e.target.value;save();render();};
$("#lvl").onchange=e=>{S.lvl=e.target.value;save();render();};
$("#reset").onclick=()=>{if(confirm("Clear everything and start over?")){S.q="";S.dump="";S.a={};S.chk={};save();render();}};

$("#build").onclick=()=>{
  const miss=update();
  if(miss.length){
    $("#msg").textContent="Not finished yet. Still to fill: "+[...new Set(miss.map(f=>f.l))].join(", ")+".";
    $("#result").hidden=true;return;
  }
  $("#msg").textContent="";
  const sl=FW[S.fw].slots,parts=sl.map(()=>[]);
  fields().forEach(f=>parts[f.slot].push(S.a[f.k].trim()));
  $("#out").innerHTML=parts.map((p,i)=>`<span style="--col:var(${COL[i%4]})">${p.join(" ").replace(/</g,"&lt;")}</span>`).join(" ");
  $("#legend").innerHTML=sl.map((s,i)=>`<span style="--col:var(${COL[i%4]})">${s.l}</span>`).join("");
  $("#result").hidden=false;
  $("#result").scrollIntoView({behavior:"smooth"});
};
$("#copy").onclick=async()=>{
  try{await navigator.clipboard.writeText($("#out").innerText);$("#copy").textContent="Copied";}
  catch(e){$("#copy").textContent="Select the text and copy it";}
};
render();
</script>
</body>
</html>
